<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Motel Maçã do Amor</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="flex bg-gray-100 min-h-screen">

<!-- Sidebar -->
<aside class="w-64 bg-white shadow-md p-4 flex flex-col gap-4 min-h-screen">
  <h1 class="text-2xl font-bold text-red-600 text-center">Motel Maçã do Amor</h1>
  <nav class="flex flex-col gap-3">
    <a href="dashboard.html" class="flex items-center gap-2 p-2 bg-gray-200 rounded">
      <i class="fa-solid fa-gauge-high"></i> Dashboard
    </a>
    <a href="quartos.html" class="flex items-center gap-2 p-2 hover:bg-gray-200 rounded"><i class="fa-solid fa-bed"></i> Quartos</a>
    <a href="controle_quartos.html" class="flex items-center gap-2 p-2 hover:bg-gray-200 rounded"><i class="fa-solid fa-sliders"></i> Controle de Quartos</a>
    <a href="consumo.html" class="flex items-center gap-2 p-2 hover:bg-gray-200 rounded"><i class="fa-solid fa-wine-bottle"></i> Consumo</a>
    <a href="pagamento.html" class="flex items-center gap-2 p-2 hover:bg-gray-200 rounded"><i class="fa-solid fa-credit-card"></i> Pagamento</a>
    <a href="relatorio.html" class="flex items-center gap-2 p-2 hover:bg-gray-200 rounded"><i class="fa-solid fa-chart-line"></i> Relatórios</a>
    <a href="produto.html" class="flex items-center gap-2 p-2 hover:bg-gray-200 rounded"><i class="fa-solid fa-box"></i> Produtos</a>
    <a href="estoque.html" class="flex items-center gap-2 p-2 hover:bg-gray-200 rounded"><i class="fa-solid fa-warehouse"></i> Estoque</a>
    <a href="usuarios.html" class="flex items-center gap-2 p-2 hover:bg-gray-200 rounded"><i class="fa-solid fa-users"></i> Usuários</a>
  </nav>
  <div class="mt-auto">
    <a href="login.html" class="flex items-center gap-2 p-2 text-red-600 hover:bg-gray-200 rounded"><i class="fa-solid fa-right-from-bracket"></i> Sair</a>
  </div>
</aside>

<!-- Main Content -->
<main class="flex-1 p-6">
  <h2 class="text-3xl font-semibold mb-6">Dashboard</h2>

  <!-- Data Atual -->
  <div id="dataAtual" class="text-gray-600 mb-4"></div>

  <!-- Cards -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
    <div class="bg-white p-6 rounded-xl shadow flex items-center justify-between">
      <div>
        <h3 class="text-gray-600 text-sm">Faturamento do Dia</h3>
        <p id="faturamentoDia" class="text-3xl font-bold text-green-600">R$ 0,00</p>
      </div>
      <i class="fa-solid fa-money-bill-wave text-green-500 text-3xl"></i>
    </div>

    <div class="bg-white p-6 rounded-xl shadow flex items-center justify-between">
      <div>
        <h3 class="text-gray-600 text-sm">Quartos Ocupados</h3>
        <p id="qtdOcupados" class="text-3xl font-bold text-red-600">0</p>
      </div>
      <i class="fa-solid fa-bed text-red-500 text-3xl"></i>
    </div>

    <div class="bg-white p-6 rounded-xl shadow flex items-center justify-between">
      <div>
        <h3 class="text-gray-600 text-sm">Consumo Total</h3>
        <p id="consumoTotal" class="text-3xl font-bold text-blue-600">R$ 0,00</p>
      </div>
      <i class="fa-solid fa-wine-bottle text-blue-500 text-3xl"></i>
    </div>
  </div>

  <!-- Botão Relatório -->
  <button class="bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-xl font-bold" onclick="gerarRelatorioDia()">Gerar Relatório PDF</button>
</main>

<script>
// Atualiza a data atual
function atualizarData() {
  const data = new Date();
  const opcoes = { day: '2-digit', month: 'long', year: 'numeric' };
  document.getElementById('dataAtual').textContent = "📅 " + data.toLocaleDateString('pt-BR', opcoes);
}

// Calcula os dados do Dashboard
function calcularDashboard() {
  let faturamentoDia = 0;
  let consumoTotal = 0;
  let ocupados = 0;

  // Quartos
  const quartos = JSON.parse(localStorage.getItem('quartos')) || [];
  ocupados = quartos.filter(q => q.status === 'ocupado').length;

  // Consumo
  const consumos = JSON.parse(localStorage.getItem('consumo')) || [];
  consumoTotal = consumos.reduce((total, c) => total + (parseFloat(c.valor) || 0), 0);

  // Pagamentos do dia
  const pagamentos = JSON.parse(localStorage.getItem('pagamentos')) || [];
  const hoje = new Date().toLocaleDateString('pt-BR');
  pagamentos.forEach(p => {
    if (p.data === hoje) faturamentoDia += parseFloat(p.valor);
  });

  // Atualiza na tela
  document.getElementById('faturamentoDia').textContent = `R$ ${faturamentoDia.toFixed(2)}`;
  document.getElementById('consumoTotal').textContent = `R$ ${consumoTotal.toFixed(2)}`;
  document.getElementById('qtdOcupados').textContent = ocupados;
}

// Função para gerar relatório
function gerarRelatorioDia() {
  alert("📊 Função de geração de relatório será implementada aqui!");
}

// Inicialização
window.addEventListener('load', () => {
  atualizarData();
  calcularDashboard();
  setInterval(calcularDashboard, 30000); // atualiza a cada 30s
});
</script>

</body>
</html>

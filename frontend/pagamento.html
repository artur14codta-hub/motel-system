<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagamento - Motel Maçã do Amor</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="flex bg-gray-100 min-h-screen">

<!-- Sidebar -->
<aside class="w-64 bg-white shadow-md p-4 flex flex-col gap-4">
  <h1 class="text-2xl font-bold text-red-600 text-center">Motel Maçã do Amor</h1>
  <nav class="flex flex-col gap-3">
    <a href="dashboard.html" class="flex items-center gap-2 p-2 bg-gray-200 rounded"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
    <a href="quartos.html" class="flex items-center gap-2 p-2 hover:bg-gray-200 rounded"><i class="fa-solid fa-bed"></i> Quartos</a>
    <a href="controle_quartos.html" class="flex items-center gap-2 p-2 hover:bg-gray-200 rounded"><i class="fa-solid fa-sliders"></i> Controle de Quartos</a>
    <a href="consumo.html" class="flex items-center gap-2 p-2 hover:bg-gray-200 rounded"><i class="fa-solid fa-wine-bottle"></i> Consumo</a>
    <a href="pagamento.html" class="flex items-center gap-2 p-2 bg-gray-200 rounded"><i class="fa-solid fa-credit-card"></i> Pagamento</a>
    <a href="relatorio.html" class="flex items-center gap-2 p-2 hover:bg-gray-200 rounded"><i class="fa-solid fa-chart-line"></i> Relatórios</a>
    <a href="produto.html" class="flex items-center gap-2 p-2 hover:bg-gray-200 rounded"><i class="fa-solid fa-box"></i> Produtos</a>
    <a href="estoque.html" class="flex items-center gap-2 p-2 hover:bg-gray-200 rounded"><i class="fa-solid fa-warehouse"></i> Estoque</a>
    <a href="usuarios.html" class="flex items-center gap-2 p-2 hover:bg-gray-200 rounded"><i class="fa-solid fa-users"></i> Usuários</a>
    <a href="diaria.html" class="flex items-center gap-2 p-2 bg-gray-200 rounded"><i class="fa-solid fa-file-alt"></i> Diária</a>
    
  </nav>
  <div class="mt-auto">
    <a href="login.html" class="flex items-center gap-2 p-2 text-red-600 hover:bg-gray-200 rounded"><i class="fa-solid fa-right-from-bracket"></i> Sair</a>
  </div>
</aside>

<!-- Main Content -->
<main class="flex-1 p-6">
  <h2 class="text-3xl font-semibold mb-6">Pagamento</h2>

  <!-- Seleção do Quarto -->
  <div class="bg-white p-6 rounded-xl shadow mb-6 max-w-lg">
    <label class="block mb-2 font-semibold">Selecione o Quarto:</label>
    <select id="quartoPagamentoSelect" class="w-full p-3 border rounded-xl"></select>
  </div>

  <!-- Resumo de Valores -->
  <div class="bg-white p-6 rounded-xl shadow mb-6 max-w-lg">
    <h3 class="text-2xl font-semibold mb-4">Resumo</h3>
    <p><strong>Valor do Quarto:</strong> R$ <span id="valorQuarto">0.00</span></p>
    <p><strong>Consumo:</strong> R$ <span id="valorConsumo">0.00</span></p>
    <p class="text-xl font-bold mt-2"><strong>Total:</strong> R$ <span id="valorTotal">0.00</span></p>
  </div>

  <!-- Formas de Pagamento -->
  <div class="bg-white p-6 rounded-xl shadow max-w-lg">
    <h3 class="text-2xl font-semibold mb-4">Formas de Pagamento</h3>

    <div class="flex flex-col gap-4">
      <div>
        <label>Dinheiro:</label>
        <input type="number" id="pgtoDinheiro" class="border rounded-xl p-2 w-full" step="0.01" min="0">
      </div>
      <div>
        <label>PIX:</label>
        <input type="number" id="pgtoPix" class="border rounded-xl p-2 w-full" step="0.01" min="0">
      </div>
      <div>
        <label>Cartão Crédito:</label>
        <input type="number" id="pgtoCredito" class="border rounded-xl p-2 w-full" step="0.01" min="0">
      </div>
      <div>
        <label>Cartão Débito:</label>
        <input type="number" id="pgtoDebito" class="border rounded-xl p-2 w-full" step="0.01" min="0">
      </div>
    </div>

    <button onclick="finalizarPagamento()" class="mt-6 bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-xl w-full">
      Finalizar Pagamento
    </button>
  </div>
</main>

<script src="pagamento.js"></script>
</body>
</html>

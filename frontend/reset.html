<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Senha - Motel Maçã do Amor</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-100">

  <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
    <h1 class="text-2xl font-bold text-red-600 text-center mb-6">Recuperar Senha</h1>
    <form>
      <div class="mb-4">
        <label class="block text-gray-700 mb-1" for="email">Informe seu e-mail</label>
        <input type="email" id="email" placeholder="seuemail@email.com" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-red-400 outline-none">
      </div>

      <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white p-3 rounded-xl font-bold">Enviar Código</button>
    </form>

    <div class="text-center mt-4">
      <a href="login.html" class="text-gray-600 hover:underline">Voltar para o login</a>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
